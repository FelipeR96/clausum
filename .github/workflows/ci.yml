name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, lint y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Sin `version`: la accion lee el campo `packageManager` de
      # package.json. Fijar aqui un numero distinto al que se usa en local
      # es lo que rompio la primera ejecucion: con pnpm 9, el bloque
      # `overrides` de pnpm-workspace.yaml (sintaxis de pnpm 10+) se ignora,
      # el lockfile deja de corresponder al manifiesto y --frozen-lockfile
      # falla.
      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      # Node 22, no 20, y la distincion importa: esta es la version que
      # EJECUTA las herramientas (pnpm, tsc, vite, vitest), no la del
      # runtime de produccion. pnpm 11 exige Node >= 22.13 --en Node 20
      # falla al cargar node:sqlite-- mientras que las Cloud Functions
      # corren sobre Node 20 segun `engines.node` de
      # backend/functions/package.json, que el CI no cambia.
      #
      # Consecuencia a tener presente: ni local (24) ni CI (22) coinciden
      # con el runtime de produccion (20), asi que una incompatibilidad
      # especifica de Node 20 solo apareceria al desplegar. Ver F2-08 en
      # docs/roadmap.md.
      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # El emulador de Firestore corre sobre la JVM: lo necesitan las
      # pruebas de reglas de seguridad.
      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Pruebas (contra emuladores)
        run: |
          pnpm exec firebase emulators:exec \
            --only firestore,storage,auth \
            --config backend/firebase/firebase.json \
            --project clausum-test \
            "pnpm test"
