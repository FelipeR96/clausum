name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, lint y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Sin `version`: la accion lee el campo `packageManager` de
      # package.json. Fijar aqui un numero distinto al que se usa en local
      # es lo que rompio la primera ejecucion: con pnpm 9, el bloque
      # `overrides` de pnpm-workspace.yaml (sintaxis de pnpm 10+) se ignora,
      # el lockfile deja de corresponder al manifiesto y --frozen-lockfile
      # falla.
      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # El emulador de Firestore corre sobre la JVM: lo necesitan las
      # pruebas de reglas de seguridad.
      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Pruebas (contra emuladores)
        run: |
          pnpm exec firebase emulators:exec \
            --only firestore,storage,auth \
            --config backend/firebase/firebase.json \
            --project clausum-test \
            "pnpm test"
