packages:
  - 'frontend'
  - 'backend/functions'
  - 'shared'
# Scripts de postinstall que se permiten o se bloquean explicitamente.
# En CI pnpm convierte un script no declarado en ERROR
# (ERR_PNPM_IGNORED_BUILDS), no en aviso como en local, asi que cualquier
# dependencia con postinstall tiene que aparecer aqui.
allowBuilds:
  '@firebase/util': true
  # Se permite a proposito: canvas 3.x descarga un binario precompilado
  # (prebuild-install + N-API) en vez de compilar con node-gyp. Con
  # canvas: false el script no corria y en Windows el OCR nunca llego a
  # funcionar: faltaba build/Release/canvas.node.
  canvas: true
  esbuild: true
  protobufjs: true
  tesseract.js: true
  # optionalDependency de superstatic, que viene con firebase-tools para el
  # emulador de hosting. Requiere compilacion nativa (node-gyp + nan) y
  # firebase-tools funciona sin ella, cayendo a las expresiones regulares
  # de JavaScript. No merece arrastrar un toolchain de C++ al CI para una
  # mejora de rendimiento que no usamos.
  re2: false

# Red de seguridad. @eslint/eslintrc@3.3.7 (latest) declara js-yaml ^4.3.2 y
# esa version no existe: la linea v4 de js-yaml termina en 4.3.0. eslint 10 ya
# no depende de eslintrc, asi que esto no deberia activarse nunca; esta por si
# algun plugin lo arrastra de forma transitiva.
#
# Comprobar si ya sobra:  pnpm why @eslint/eslintrc
# Si no aparece nada, borra este bloque.
overrides:
  '@eslint/eslintrc': '3.3.1'

  # canvas 2.11.2 (via pdf-img-convert) no tiene binario para el ABI de
  # Node 22 (node-v127): intenta compilar desde fuente y falla en Cloud
  # Build, que no trae pangocairo. En Node 20 si existia el binario, por eso
  # el fallo no aparecio hasta subir el runtime.
  #
  # La 3.x migro a N-API, asi que un solo binario sirve para cualquier
  # version de Node y no hay que volver a pasar por esto en el proximo salto.
  #
  # pdf-img-convert pide ^2.11.2; la API que usamos (convert con scale y
  # page_numbers) no cambio entre 2.x y 3.x.
  canvas: '^3.2.3'
